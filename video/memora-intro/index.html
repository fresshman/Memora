<!doctype html>
<html lang="zh-CN" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="./gsap.min.js"></script>
    <style>
      @font-face { font-family: 'Microsoft YaHei'; src: local('Microsoft YaHei'); }
      @font-face { font-family: 'PingFang SC'; src: local('PingFang SC'); }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 1920px; height: 1080px; overflow: hidden;
        background: #070d1c;
        font-family: "Inter", "Microsoft YaHei", "PingFang SC", ui-sans-serif,
          system-ui, -apple-system, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      #stage { width: 1920px; height: 1080px; position: relative; }

      .bg { position: absolute; inset: 0; z-index: 0; }
      .bg .grad {
        position: absolute; inset: 0;
        background:
          radial-gradient(1200px 760px at 10% -12%, rgba(20,184,166,.20), transparent 60%),
          radial-gradient(1050px 760px at 108% 112%, rgba(56,189,248,.16), transparent 60%),
          linear-gradient(160deg, #0a1326 0%, #080e1e 55%, #0a1224 100%);
      }
      .grid-lines {
        position: absolute; inset: 0; opacity: .32;
        background-image:
          linear-gradient(rgba(148,163,184,.055) 1px, transparent 1px),
          linear-gradient(90deg, rgba(148,163,184,.055) 1px, transparent 1px);
        background-size: 64px 64px;
        mask-image: radial-gradient(1300px 950px at 50% 42%, #000 40%, transparent 100%);
      }
      .orb { position: absolute; border-radius: 50%; filter: blur(80px); opacity: .5; }
      .orb.a { width: 440px; height: 440px; left: -130px; top: 580px;
        background: rgba(20,184,166,.32); }
      .orb.b { width: 460px; height: 460px; right: -140px; top: -130px;
        background: rgba(56,189,248,.26); }

      .scene { position: absolute; inset: 0; z-index: 10; opacity: 0; }

      .browser {
        position: absolute; left: 50%; top: 46%;
        width: 1600px; height: 1044px;
        transform: translate(-50%, -50%) scale(.9);
        border-radius: 18px; overflow: hidden;
        background: #fff;
        border: 1px solid rgba(148,163,184,.22);
        box-shadow: 0 60px 120px rgba(0,0,0,.6),
          0 0 0 1px rgba(45,212,191,.08);
      }
      .browser-bar {
        height: 44px; flex: 0 0 44px; display: flex; align-items: center; gap: 8px;
        padding: 0 18px;
        background: linear-gradient(180deg, #eef2f7, #e4e9f0);
        border-bottom: 1px solid #d7dde6;
      }
      .browser-bar .dot { width: 12px; height: 12px; border-radius: 50%; }
      .browser-bar .d1 { background: #ff5f57; }
      .browser-bar .d2 { background: #febc2e; }
      .browser-bar .d3 { background: #28c840; }
      .browser-bar .url {
        margin-left: 16px; flex: 1; height: 26px; border-radius: 8px;
        background: #fff; border: 1px solid #d3d9e2;
        display: flex; align-items: center; padding: 0 14px;
        color: #64748b; font-size: 13px;
      }
      .browser-body { position: relative; width: 1600px; height: 1000px; overflow: hidden; }

      /* 图层：每个截图一层，随图片一起平移；宽1600，高=图片高 */
      .layer { position: absolute; left: 0; top: 0; width: 1600px;
        opacity: 0; will-change: transform; transform-origin: 50% 0%; }
      .layer img { display: block; width: 1600px; height: auto; }
      .seq-layer { position: absolute; inset: 0; width: 1600px; height: 1000px; }
      .seq-layer img {
        position: absolute; inset: 0; width: 1600px; height: 1000px;
        object-fit: cover; opacity: 0; transform-origin: 50% 50%;
        will-change: transform; }

      .hl {
        position: absolute; border: 2.5px solid #0ea5a4; border-radius: 12px;
        box-shadow: 0 0 0 2px rgba(255,255,255,.55),
          0 0 22px 4px rgba(20,184,166,.5),
          inset 0 0 18px rgba(20,184,166,.14);
        opacity: 0; pointer-events: none;
      }
      .hl.amber { border-color: #f59e0b;
        box-shadow: 0 0 0 2px rgba(255,255,255,.55),
          0 0 22px 4px rgba(245,158,11,.5),
          inset 0 0 18px rgba(245,158,11,.14); }
      .hl-tag {
        position: absolute; top: -34px; left: -2px;
        padding: 5px 13px; border-radius: 9px;
        background: #0ea5a4; color: #fff;
        font-size: 15px; font-weight: 700; white-space: nowrap;
      }
      .hl.amber .hl-tag { background: #f59e0b; }

      .mouse {
        position: absolute; left: 0; top: 0; width: 34px; height: 34px;
        margin: -3px 0 0 -4px; opacity: 0; z-index: 40;
      }
      .mouse svg { width: 30px; height: 30px; display: block;
        filter: drop-shadow(0 3px 4px rgba(0,0,0,.4)); }
      .click-ripple {
        position: absolute; left: 0; top: 0; width: 24px; height: 24px;
        border-radius: 50%; border: 2.5px solid #14b8a6; opacity: 0; z-index: 39;
      }

      .caption {
        position: absolute; left: 140px; right: 140px; bottom: 18px;
        display: flex; align-items: center; gap: 26px;
        background: rgba(8,14,28,.74);
        border: 1px solid rgba(148,163,184,.18);
        border-radius: 16px; padding: 14px 30px;
        backdrop-filter: blur(8px);
        opacity: 0;
      }
      .cap-num {
        flex: 0 0 60px; height: 60px; border-radius: 16px;
        background: linear-gradient(135deg, #2dd4bf, #0ea5b7);
        color: #04201d; font-weight: 800; font-size: 27px;
        display: flex; align-items: center; justify-content: center;
      }
      .cap-text { flex: 1; }
      .cap-title { color: #f1f5f9; font-size: 28px; font-weight: 800;
        letter-spacing: -.01em; margin-bottom: 4px; }
      .cap-desc { color: #aebdd0; font-size: 21px; line-height: 1.45; }

      .title-scene { display: flex; flex-direction: column;
        align-items: center; justify-content: center; height: 100%; }
      .t-logo {
        width: 118px; height: 118px; border-radius: 32px;
        background: linear-gradient(135deg, #2dd4bf, #0ea5b7);
        display: flex; align-items: center; justify-content: center;
        color: #04201d; font-weight: 800; font-size: 66px;
        box-shadow: 0 18px 50px rgba(20,184,166,.45);
        margin-bottom: 36px;
      }
      .t-name { color: #f3f7fb; font-size: 92px; font-weight: 800;
        letter-spacing: -.03em; line-height: 1; }
      .t-sub { margin-top: 24px; font-size: 36px; font-weight: 600;
        background: linear-gradient(120deg, #2dd4bf, #7dd3fc);
        -webkit-background-clip: text; background-clip: text; color: transparent; }
      .t-desc { margin-top: 30px; color: #aab9cc; font-size: 25px; max-width: 1200px;
        text-align: center; line-height: 1.6; }
      .t-chips { display: flex; gap: 16px; margin-top: 42px; }
      .t-chip {
        padding: 12px 26px; border-radius: 999px;
        background: rgba(148,163,184,.09); border: 1px solid rgba(148,163,184,.2);
        color: #d7e0ea; font-size: 22px; font-weight: 600;
      }
      .t-link { margin-top: 38px; color: #7dd3fc; font-size: 24px; font-weight: 600; }

      .pkg-scene { display: flex; flex-direction: column; align-items: center;
        justify-content: center; height: 100%; }
      .pkg-head { text-align: center; margin-bottom: 38px; }
      .pkg-head h2 { color: #f3f7fb; font-size: 52px; font-weight: 800; }
      .pkg-head p { color: #aab9cc; font-size: 24px; margin-top: 14px; }
      .pkg-grid { display: grid; grid-template-columns: repeat(3, 1fr);
        gap: 24px; width: 1180px; }
      .pkg-card {
        border-radius: 18px; padding: 26px;
        background: rgba(255,255,255,.045); border: 1px solid rgba(148,163,184,.18);
        opacity: 0; transform: translateY(24px);
      }
      .pkg-card .ico { width: 50px; height: 50px; border-radius: 14px;
        background: linear-gradient(135deg, rgba(45,212,191,.22), rgba(56,189,248,.2));
        border: 1px solid rgba(45,212,191,.4);
        display: flex; align-items: center; justify-content: center;
        color: #5eead4; font-size: 26px; font-weight: 800; margin-bottom: 18px; }
      .pkg-card .fn { color: #eaf1f8; font-size: 23px; font-weight: 700; margin-bottom: 8px; }
      .pkg-card .fd { color: #97a8bd; font-size: 18px; line-height: 1.5; }
    </style>
  </head>
  <body>
    <div id="stage" data-composition-id="memora-intro" data-width="1920" data-height="1080">
      <div class="bg">
        <div class="grad"></div>
        <div class="grid-lines"></div>
        <div class="orb a"></div>

    <script>
    (function () {
      var stage = document.getElementById('stage');

      /* 帧：h=截图真实高度（宽1600）；全页 h>1000 自动向下平移 */
      var SCENES = [
        { t: 'title', s: 0, d: 5,

        { t: 'shots', s: 5, d: 6, n: 1,

          title: '导入与复盘',
          desc: '上传聊天记录文件，或直接粘贴对话文本，本地解析',
          hl: [ { at: 0.6, r: [470, 185, 820, 205], tag: '上传 / 粘贴' } ],

        { t: 'shots', s: 11, d: 11, n: 2,

        { t: 'seq', s: 22, d: 16, n: 3,
          count: 19, title: '一键复盘 · 流式生成',
          desc: '端侧模型通过 SSE 逐字流式输出报告' },

        { t: 'shots', s: 38, d: 12, n: 4,
          frames: [ { img: 'assets/grow_19.png', h: 1000 } ],
          title: '结构化复盘报告',
          desc: '核心结论、待办清单、关键信息、风险提示，四段呈现',
          hl: [
            { at: 0.5, r: [480, 163, 840, 180], tag: '核心结论' },
            { at: 3.3, r: [480, 358, 840, 165], tag: '待办清单' },
            { at: 6.1, r: [480, 537, 840, 210], tag: '关键信息' },
            { at: 8.9, r: [480, 762, 840, 118], tag: '风险提示' } ] },

        { t: 'shots', s: 50, d: 6, n: 5,
          frames: [ { img: 'assets/review_restored.png', h: 1000 } ],
          title: '一键还原真实信息',
          desc: '报告生成后可还原真名，仅在本机显示，不写入加密库',
          hl: [ { at: 0.7, r: [470, 920, 820, 40], tag: '仅本机显示' } ] },

        { t: 'shots', s: 56, d: 6, n: 6,
          frames: [ { img: 'assets/parse_dingtalk.png', h: 1000 } ],
          title: '钉钉记录',
          desc: '解析钉钉 CSV，4 条消息，本地脱敏 3 个人名',
          hl: [ { at: 0.7, r: [565, 432, 770, 236], tag: '钉钉 · 4 条 · 52 字' } ] },

        { t: 'shots', s: 62, d: 6, n: 7,
          frames: [ { img: 'assets/parse_feishu.png', h: 1000 } ],
          title: '飞书记录',
          desc: '解析飞书 HTML，包含撤回消息，本地脱敏 2 个人名',
          hl: [ { at: 0.7, r: [565, 432, 770, 192], tag: '飞书 · 2 条 · 32 字' } ] },

        { t: 'shots', s: 68, d: 9, n: 8,
          frames: [ { img: 'assets/batch_final_full.png', h: 1039 } ],
          title: '批量复盘',
          desc: '一次处理多个文件，汇总成功与失败，统一导出',
          hl: [ { at: 0.7, r: [492, 468, 160, 40], tag: '共 3 份 · 成功 3 · 失败 0' } ] },

        { t: 'shots', s: 77, d: 14, n: 9,
          frames: [
            { img: 'assets/qa_stream_01.png', h: 1000 },
            { img: 'assets/qa_answer_full.png', h: 1000, at: 7 } ],
          title: '对话问答',
          desc: '基于已导入对话追问，模型引用原文与时间作答',
          hl: [
            { f: 0, at: 0.6, r: [475, 528, 760, 58], tag: '提问' },
            { f: 1, at: 1.0, r: [478, 652, 806, 96], tag: '回答 · 引用原文', amber: true } ] },

        { t: 'shots', s: 91, d: 12, n: 10,
          frames: [
            { img: 'assets/voice_proc_01.png', h: 1000 },
            { img: 'assets/voice_record_full.png', h: 1173, at: 4 } ],
          title: '会议录音转写',
          desc: '本地转写并分离说话人，支持 MP3 / WAV 等多种音频格式',
          hl: [
            { f: 1, at: 1.0, r: [565, 352, 770, 32], tag: '多音频格式' },
            { f: 1, at: 3.5, r: [565, 618, 770, 308], tag: '说话人分离 · 4 位' } ] },

        { t: 'shots', s: 103, d: 10, n: 11,
          frames: [ { img: 'assets/rename_typed_w1.png', h: 1000 } ],
          title: '校对记录',
          desc: '重命名说话人、直接修正每段转写文字',
          hl: [
            { at: 0.8, r: [600, 460, 110, 36], tag: '重命名为 王老师' },
            { at: 5.0, r: [700, 458, 570, 282], tag: '逐段修正文字' } ] },

        { t: 'shots', s: 113, d: 9, n: 12,
          frames: [ { img: 'assets/voice_contacts_registered.png', h: 1000 } ],
          title: '联系人声纹库',
          desc: '重命名时自动注册声纹，纯本地存储，数据不出设备',
          hl: [ { at: 0.7, r: [568, 372, 460, 254], tag: '声纹库 · 本地存储' } ] },

        { t: 'shots', s: 122, d: 9, n: 13,
          frames: [ { img: 'assets/voice_identified_full.png', h: 1194 } ],
          title: '跨会议自动识别',
          desc: '下一场会议，凭声纹自动认出同一人',
          hl: [ { at: 0.8, r: [590, 645, 770, 135], tag: '王老师 / 李老师 · 已认出' } ] },

        { t: 'shots', s: 131, d: 10, n: 14,
          frames: [ { img: 'assets/voice_minutes_full.png', h: 1553 } ],
          title: '会议纪要',
          desc: '提炼结论、待办、关键信息与风险；无待办时如实标注',
          hl: [ { at: 8.0, r: [565, 985, 775, 410], tag: '四段式会议纪要' } ] },

        { t: 'shots', s: 141, d: 16, n: 15,
          frames: [
            { img: 'assets/board_final_01.png', h: 1401 },
            { img: 'assets/board_final_02.png', h: 1255, at: 6 },
            { img: 'assets/board_final_03.png', h: 1200, at: 11 } ],
          title: '跨会议行动项追踪',
          desc: '跟进责任人、时间节点与完成状态；逾期自动标红',
          hl: [
            { f: 2, at: 0.6, r: [298, 120, 1240, 82], tag: '状态统计' },
            { f: 2, at: 2.4, r: [255, 268, 1210, 200], tag: '看板 · 四状态流转' } ] },

        { t: 'shots', s: 157, d: 6, n: 16,
          frames: [ { img: 'assets/board_deep.png', h: 1000 } ],
          title: '思考档位',
          desc: '快速模式与深度思考切换，Spark 模型的官方特色',
          hl: [ { at: 0.7, r: [1195, 28, 140, 46], tag: '深度思考中' } ] },

        { t: 'shots', s: 163, d: 7, n: 17,
          frames: [ { img: 'assets/history_view_full.png', h: 1000 } ],
          title: '历史记录',
          desc: '纪要加密保存，可回看、导出或删除',
          hl: [ { at: 0.7, r: [490, 205, 830, 470], tag: '本地加密 · 可回看' } ] },

        { t: 'shots', s: 170, d: 8, n: 18,
          frames: [ { img: 'assets/page_models.png', h: 1000 } ],
          title: '模型管理',
          desc: '推荐端侧模型，缺失时通过 ModelScope 一键下载 GGUF',
          hl: [ { at: 0.7, r: [315, 325, 1010, 390], tag: '4B / 1.7B 模型卡' } ] },

        { t: 'package', s: 178, d: 10, n: 19,
          title: '项目复盘包',
          desc: '一键导出，聚合报告、行动项、记录、问答与原始对话',
          files: [
            ['01', '01_复盘报告.md', '结构化复盘报告'],
            ['02', '02_行动项清单.md', '跨会议行动项'],
            ['03', '03_会议记录.md', '说话人 + 时间戳'],
            ['04', '04_问答记录.md', '问答留痕'],
            ['05', '05_原始对话.md', '原始文本'],
            ['i', 'README.md', '目录与行动项概览'] ] },

        { t: 'title', s: 188, d: 8,
          logo: 'M', name: '完全离线 · 隐私安全',
          sub: '数据不出设备 · 开源可自部署',
          desc: '本地 RAG 检索、PII 脱敏、行动项闭环，全部在个人电脑完成',
          chips: ['Windows 可离线部署', '无需安装 Torch', '内存友好'],
          link: 'gitee.com/FreeBlank/memora' }
      ];

      var TOTAL = 196;

      function el(tag, cls, parent) {
        var e = document.createElement(tag);
        if (cls) e.className = cls;
        if (parent) parent.appendChild(e);
        return e;
      }

      function addScene(scene) {
        var sc = el('div', 'scene', stage);
        sc.setAttribute('data-start', scene.s);
        sc.setAttribute('data-duration', scene.d);
        sc.classList.add('clip');
        scene._root = sc;
        return sc;
      }
      function addHl(parent, h) {
        var box = el('div', 'hl' + (h.amber ? ' amber' : ''), parent);
        box.style.left = h.r[0] + 'px'; box.style.top = h.r[1] + 'px';
        box.style.width = h.r[2] + 'px'; box.style.height = h.r[3] + 'px';
        var tag = el('div', 'hl-tag', box); tag.textContent = h.tag;
        return box;
      }
      function addCaption(scene, sc) {
        var cap = el('div', 'caption', sc);
        var num = el('div', 'cap-num', cap); num.textContent = String(scene.n);
        var tx = el('div', 'cap-text', cap);
        var tt = el('div', 'cap-title', tx); tt.textContent = scene.title;
        var td = el('div', 'cap-desc', tx); td.textContent = scene.desc;
        scene._cap = cap;
      }

      SCENES.forEach(function (scene) {
        if (scene.t === 'title') {
          var sc = addScene(scene);
          var inner = el('div', 'title-scene', sc);
          var logo = el('div', 't-logo', inner); logo.textContent = scene.logo;
          var nm = el('div', 't-name', inner); nm.textContent = scene.name;
          var sub = el('div', 't-sub', inner); sub.textContent = scene.sub;
          var ds = el('div', 't-desc', inner); ds.textContent = scene.desc;
          if (scene.chips) {
            var cs = el('div', 't-chips', inner);
            scene.chips.forEach(function (c) { var x = el('div', 't-chip', cs); x.textContent = c; });
          }
          if (scene.link) { var lk = el('div', 't-link', inner); lk.textContent = scene.link; }
          return;
        }

        if (scene.t === 'package') {
          var pc = addScene(scene);
          var pi = el('div', 'pkg-scene', pc);
          var head = el('div', 'pkg-head', pi);
          var h2 = el('h2', null, head); h2.textContent = scene.title;
          var p = el('p', null, head); p.textContent = scene.desc;
          var grid = el('div', 'pkg-grid', pi);
          scene._cards = [];
          scene.files.forEach(function (f) {
            var card = el('div', 'pkg-card', grid);
            var ico = el('div', 'ico', card); ico.textContent = f[0];
            var fn = el('div', 'fn', card); fn.textContent = f[1];
            var fd = el('div', 'fd', card); fd.textContent = f[2];
            scene._cards.push(card);
          });
          return;
        }

        // shots / seq 浏览器窗口
        var bsc = addScene(scene);
        var br = el('div', 'browser', bsc);
        var bar = el('div', 'browser-bar', br);
        ['d1','d2','d3'].forEach(function (c) { el('div', 'dot ' + c, bar); });
        var url = el('div', 'url', bar); url.textContent = 'Memora · 本地运行 · 127.0.0.1';
        var body = el('div', 'browser-body', br);

        if (scene.t === 'seq') {
          var sl = el('div', 'seq-layer', body);
          var imgs = [];
          for (var i = 1; i <= scene.count; i++) {
            var im = el('img', '', sl);
            im.src = 'assets/grow_' + (i < 10 ? '0' + i : i) + '.png';
            imgs.push(im);
          }
          scene._seqImgs = imgs;
          scene._hls = (scene.hl || []).map(function (h) { return { el: addHl(sl, h), at: h.at }; });
        } else {
          scene._layers = [];
          scene.frames.forEach(function (f) {
            var layer = el('div', 'layer', body);
            layer.style.height = f.h + 'px';
            var img = el('img', '', layer); img.src = f.img;
            var list = (scene.hl || []).filter(function (h) { return (h.f || 0) === scene.frames.indexOf(f); });
            var hls = list.map(function (h) { return { el: addHl(layer, h), at: h.at }; });
            scene._layers.push({ layer: layer, img: img, f: f, hls: hls });
          });
          if (scene.mouse) {
            var m = el('div', 'mouse', body);
            m.innerHTML = '<svg viewBox="0 0 24 24"><path d="M4 2l7 19 2.2-7.8L21 11z" fill="#0f172a" stroke="#fff" stroke-width="1.4" stroke-linejoin="round"/></svg>';
            var rp = el('div', 'click-ripple', body);
            scene._mouse = { el: m, ripple: rp, at: scene.mouse.at, x: scene.mouse.x, y: scene.mouse.y };
          }
        }
        addCaption(scene, bsc);
      });

      /* ================= 时间轴 ================= */
      var tl = gsap.timeline({ paused: true });
      window.__timelines = window.__timelines || {};
      window.__timelines['memora-intro'] = tl;

      SCENES.forEach(function (scene) {
        var s = scene.s, d = scene.d;

        if (scene.t === 'title') {
          tl.set(scene._root, { opacity: 1 }, s);
          tl.from(scene._root.querySelectorAll('.title-scene > *'),
            { opacity: 0, y: 26, duration: .7, stagger: .09, ease: 'power2.out' }, s + .15);
          tl.to(scene._root, { opacity: 0, duration: .35 }, s + d - .35);
          return;
        }
        if (scene.t === 'package') {
          tl.set(scene._root, { opacity: 1 }, s);
          scene._cards.forEach(function (card, i) {
            tl.fromTo(card, { opacity: 0, y: 26 },
              { opacity: 1, y: 0, duration: .55, ease: 'power2.out' }, s + .3 + i * .18);
          });
          tl.to(scene._root, { opacity: 0, duration: .35 }, s + d - .35);
          return;
        }

        tl.set(scene._root, { opacity: 1 }, s);
        tl.from(scene._root.querySelector('.browser'),
          { opacity: 0, y: 34, duration: .6, ease: 'power2.out' }, s + .1);
        tl.fromTo(scene._cap, { opacity: 0, y: 16 },
          { opacity: 1, y: 0, duration: .5, ease: 'power2.out' }, s + .25);

        if (scene.t === 'seq') {
          var step = d / scene.count;
          scene._seqImgs.forEach(function (im, i) {
            if (i === 0) {
              tl.set(im, { opacity: 1, scale: 1 }, s);
            } else {
              tl.set(im, { opacity: 1, scale: 1 }, s + i * step);
              tl.set(scene._seqImgs[i - 1], { opacity: 0 }, s + i * step);
            }
          });
        } else {
          scene._layers.forEach(function (L, i) {
            var at = s + (L.f.at || 0);
            var dur = (i + 1 < scene._layers.length ? scene._layers[i + 1].f.at : d) - (L.f.at || 0);
            tl.set(L.layer, { opacity: 1, y: 0 }, at);
            if (i > 0) tl.set(scene._layers[i - 1].layer, { opacity: 0 }, at);
            if (L.f.h <= 1000) {
              // 视口截图：整个图层（含高亮）缓慢放大
              tl.fromTo(L.layer, { scale: 1.03, y: 0 },
                { scale: 1.075, y: 0, duration: dur, ease: 'power1.inOut' }, at);
            } else {
              // 全页截图：整个图层（含高亮）向下平移展示
              var endY = 1000 - L.f.h;
              tl.fromTo(L.layer, { y: 0, scale: 1.005 },
                { y: endY, scale: 1.005, duration: Math.min(dur, dur * .92), ease: 'power1.inOut' }, at);
            }
          });
          // 高亮：逐段切换，聚焦当前
          var flatHl = [];
          scene._layers.forEach(function (L) {
            L.hls.forEach(function (h) {
              flatHl.push({ el: h.el, time: s + (L.f.at || 0) + h.at });
            });
          });
          flatHl.sort(function (a, b) { return a.time - b.time; });
          flatHl.forEach(function (h, i) {
            if (i > 0) tl.to(flatHl[i - 1].el, { opacity: 0, duration: .3 }, h.time);
            tl.fromTo(h.el, { opacity: 0, scale: .85 },
              { opacity: 1, scale: 1, duration: .45, ease: 'back.out(1.7)' }, h.time);
          });
          if (scene._mouse) {
            var mm = scene._mouse;
            tl.set(mm.el, { opacity: 1, x: mm.x - 120, y: mm.y - 80 }, s + mm.at - .8);
            tl.to(mm.el, { x: mm.x, y: mm.y, duration: .7, ease: 'power2.inOut' }, s + mm.at - .8);
            tl.set(mm.ripple, { x: mm.x, y: mm.y, scale: .5 }, s + mm.at);
            tl.to(mm.ripple, { opacity: .9, duration: .08 }, s + mm.at);
            tl.to(mm.ripple, { opacity: 0, scale: 2.2, duration: .6, ease: 'power2.out' }, s + mm.at + .08);
            tl.to(mm.el, { opacity: 0, duration: .3 }, s + mm.at + 1.2);
          }
        }

        tl.to(scene._cap, { opacity: 0, duration: .3 }, s + d - .35);
        tl.to(scene._root, { opacity: 0, duration: .35 }, s + d - .35);
      });

      tl.set({}, {}, TOTAL);
    })();
    </script>
  </body>
</html>
